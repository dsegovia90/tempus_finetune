[project]
name = "tempus"
version = "0.1.0"
description = "Finetune small models to extract times of day from chat messages"
license = "MIT OR Apache-2.0"
license-files = ["LICENSE-MIT", "LICENSE-APACHE"]
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0.3",
]

[project.scripts]
tempus = "tempus.cli:main"

[dependency-groups]
classifier = [
    "onnx>=1.23.2",
    "onnxruntime>=1.31.1",
    "onnxscript>=0.7.2",
    "torch>=2.14.1",
    "transformers>=5.17.0",
]
dev = [
    "pytest>=8",
    "tokenizers>=0.23",
]
gpu = [
    "flash-linear-attention==0.5.1",
    "mlflow>=3.18.0",
    "unsloth>=2026.11.4",
]
rules = [
    "emoji<1",
    "recognizers-text-suite==1.0.2a2",
]

[build-system]
requires = ["uv_build>=0.10.0,<0.11.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
